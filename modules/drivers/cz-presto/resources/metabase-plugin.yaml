info:
  name: Metabase ClickZetta Lakehouse (Presto) Driver
  version: 1.0.3
  description: Allows Metabase to connect to ClickZetta Lakehouse with Presto Syntax.
driver:
  name: cz-presto
  display-name: ClickZetta Lakehouse (Presto)
  lazy-load: true
  parent: sql-jdbc
  connection-properties:
    - name: instance
      display-name: InstanceID
      type: string
      required: true
      placeholder: "myinstanceid"
      description: "The instance ID  of your ClickZetta Lakehouse."
    - name: service
      display-name: Service
      type: string
      required: true
      placeholder: "api.clickzetta.com"
      description: "The service name of your ClickZetta Lakehouse."
    - user
    - password
    - name: workspace
      display-name: Workspace
      type: string
      required: true
      placeholder: "myworkspace"
      description: "The workspace name of your ClickZetta Lakehouse."
    - name: virtualCluster
      display-name: Virtual Cluster
      type: string
      required: true
      placeholder: "default"
      description: "The virtual cluster name of your ClickZetta Lakehouse."
    - name: schema
      display-name: Schema
      type: string
      required: false
      placeholder: "schema_name"
      description: "The schema name of your ClickZetta Lakehouse."
    - name: additional
      display-name: Additional Properties
      type: string
      required: false
      placeholder: "key1=value1&key2=value2"
      description: "Additional properties to be passed to the JDBC driver."
    - advanced-options-start
    - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.cz-presto
  - step: register-jdbc-driver
    class: com.clickzetta.client.jdbc.ClickZettaDriver
